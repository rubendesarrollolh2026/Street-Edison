<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Street Edison</title>

<link rel="stylesheet"
href="css/base.css">

<link rel="stylesheet"
href="css/mapa.css">

<link rel="stylesheet"
href="css/botones.css">

<link rel="stylesheet"
href="css/paneles.css">

<link rel="stylesheet"
href="css/paneles/aprendizaje.css">

<link rel="stylesheet"
href="css/paneles/et.css">

<link rel="stylesheet"
href="css/paneles/referencias.css">

<link rel="stylesheet"
href="css/paneles/ruta.css">

<link rel="stylesheet"
href="css/intro.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<h1>Street Edison</h1>


<div class="panel-lateral">

<button class="btn-lateral"
onclick="mostrarPestana('aprendizaje')">

🧭

</button>

<button class="btn-lateral"
onclick="mostrarPestana('et')">

⚡

</button>

<button class="btn-lateral"
onclick="mostrarPestana('referencias')">

📍

</button>

<button class="btn-lateral"
onclick="alternarSeguimiento()">

🎯

</button>

<button class="btn-lateral"
onclick="mostrarPestana('ruta')">

▶

</button>

</div>


<div id="aprendizaje"
class="contenido">

<div class="tirador"
onclick="alternarPanel('aprendizaje')">

━━━━━━

</div>

<h2>Modo aprendizaje</h2>

<div id="ubicacion">

Esperando ubicación...

</div>

<br>

<button
onclick="obtenerUbicacion()">

Obtener ubicación

</button>

</div>




<div id="et"
class="contenido oculto">

<div class="tirador"
onclick="alternarPanel('et')">

━━━━━━

</div>

<h2>Guardar ET / Cuadro</h2>

<input
type="text"
id="nombreET"
placeholder="ET-14">

<br><br>

<button
onclick="guardarET()">

Guardar ET

</button>

<hr>

<h3>

ET guardadas

</h3>

<div id="listaET"></div>

</div>




<div id="referencias"
class="contenido oculto">

<div class="tirador"
onclick="alternarPanel('referencias')">

━━━━━━

</div>

<h2>

Referencias

</h2>

<p>

Sin referencias todavía

</p>

</div>




<div id="ruta"
class="contenido oculto">

<div class="tirador"
onclick="alternarPanel('ruta')">

━━━━━━

</div>

<h2>

Rutas

</h2>

<div id="estadoRuta">

Ruta detenida

</div>

<br>

<button
onclick="iniciarRuta()">

▶ Iniciar ruta

</button>

<br><br>

<button
onclick="detenerRuta()">

■ Detener ruta

</button>

<br><br>

<button
onclick="cargarRutaDesdeSheets()">

☁ Cargar ruta Sheets

</button>

<hr>

<h3>

Rutas guardadas

</h3>

<div id="listaRutas">

Sin rutas

</div>

</div>




<div id="mapa"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="js/gps.js"></script>

<script src="js/guardar.js"></script>

<script src="js/ui.js"></script>

<script src="js/paneles/deslizable.js"></script>

<script src="js/seguimiento.js"></script>

<script src="js/vehiculo.js"></script>

<script src="js/googleSheets.js"></script>

<script src="js/rutas.js"></script>


</body>

</html>
